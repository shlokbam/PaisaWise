name: Build PaisaWise Android APK

on:
  # Run automatically on every push to main
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/build-android.yml'

  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL (e.g. http://192.168.1.4:8000/api/v1)'
        required: false
        default: 'http://192.168.1.4:8000/api/v1'

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout the repository ──────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Node.js 22 (required by @capacitor/cli@8.x) ───────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # ── 3. Set up Java 17 (required by Android Gradle) ──────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Install web dependencies ──────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci
        working-directory: web

      # ── 5. Build the React/Vite web app (with Android API URL) ──────────
      - name: Build web app for Android
        run: |
          API_URL="${{ github.event.inputs.api_url || 'http://192.168.1.4:8000/api/v1' }}"
          echo "Building with API URL: $API_URL"
          VITE_API_BASE_URL="$API_URL" npm run build
        working-directory: web

      # ── 6. Copy built web assets into Android project ────────────────────
      #    Skip `npx cap sync` to avoid Node version fragility.
      #    The android/ project is already committed; just overwrite assets.
      - name: Copy web dist into Android assets
        run: |
          ASSETS_DIR="android/app/src/main/assets/public"
          rm -rf "$ASSETS_DIR"
          mkdir -p "$ASSETS_DIR"
          cp -r dist/. "$ASSETS_DIR/"
          # Also copy Capacitor runtime files (cordova shims required by Gradle)
          cp -f android/app/src/main/assets/public/cordova.js "$ASSETS_DIR/cordova.js" 2>/dev/null || true
          cp -f android/app/src/main/assets/public/cordova_plugins.js "$ASSETS_DIR/cordova_plugins.js" 2>/dev/null || true
          echo "✅ Copied dist into $ASSETS_DIR"
          ls "$ASSETS_DIR"
        working-directory: web

      # ── 7. Write local.properties (tells Gradle where the Android SDK is) ─
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
        working-directory: web/android

      # ── 8. Make Gradle wrapper executable ───────────────────────────────
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
        working-directory: web/android

      # ── 9. Build the debug APK ───────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tail -100
        working-directory: web/android

      # ── 9. Upload APK as downloadable artifact ───────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PaisaWise-debug-${{ github.run_number }}
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 10. Print download instructions ──────────────────────────────────
      - name: Build complete
        run: |
          echo "=============================================="
          echo "  ✅ PaisaWise APK built successfully!"
          echo "=============================================="
          echo "  1. Go to Actions tab → this run → Artifacts"
          echo "  2. Download 'PaisaWise-debug-${{ github.run_number }}'"
          echo "  3. Unzip → transfer app-debug.apk to phone"
          echo "  4. Phone: Settings → Install Unknown Apps → Allow"
          echo "  5. Tap APK → Install → Open → enjoy!"
          echo ""
          echo "  Backend URL: ${{ github.event.inputs.api_url || 'http://192.168.1.4:8000/api/v1' }}"
          echo "=============================================="
